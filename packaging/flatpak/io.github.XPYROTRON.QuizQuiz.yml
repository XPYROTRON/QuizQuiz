app-id: io.github.XPYROTRON.QuizQuiz
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: quizquiz
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: quizquiz
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
    sources:
      - type: dir
        path: ../..
